name: Daily FG Variance Email

on:
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run variance email script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SAP_PASSWORD: ${{ secrets.SAP_PASSWORD }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          MAIL_CLIENT_SECRET: ${{ secrets.MAIL_CLIENT_SECRET }}
        run: python fg-variance-email-meet.py
